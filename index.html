<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para ti</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #050505;
      color: white;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: url('cafe_juntos.jpg') center/cover no-repeat;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    /* 🔥 TEXTO PRINCIPAL MÁS GRANDE */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    /* 🔥 TEXTO SECUNDARIO MÁS GRANDE */
    p {
      font-size: 1.6rem;
      opacity: 0.9;
      margin-bottom: 45px;
      line-height: 1.5;
    }

    /* 🔥 BOTÓN MÁS GRANDE Y PROTAGONISTA */
    a.button {
      display: inline-block;
      padding: 16px 36px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.3s ease;
    }

    a.button:hover {
      transform: scale(1.06);
      background: #f2f2f2;
    }

    section {
      padding: 100px 20px;
    }

    iframe {
      width: 100%;
      max-width: 900px;
      height: 500px;
      border-radius: 16px;
    }

    .final {
      margin-top: 50px;
      opacity: 0.8;
      font-size: 1.2rem;
    }

    /* 📱 RESPONSIVE */
    @media (max-width: 600px) {

      h1 {
        font-size: 2.8rem;
      }

      p {
        font-size: 1.2rem;
      }

      iframe {
        height: 240px;
      }
    }

  </style>
</head>

<body>

<div class="hero">
  <div class="overlay"></div>

  <div class="content">

    <h1>No es solo para hoy…</h1>

    <p>
      es para que puedas volver a este momento cuando quieras..
    </p>

    <a href="#video" class="button">Esto es para ti</a>

  </div>
</div>

<section id="video">

  <iframe 
    src="https://www.youtube.com/embed/TU_VIDEO_ID"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <div class="final">
    No es mucho, pero es sincero.
    Y me gusta pensar que lo escucharás y pienses en mí… porque yo pienso en ti.
  </div>

</section>

</body>
</html>
