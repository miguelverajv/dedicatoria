<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para ti</title>

  <!-- Tipografías elegantes -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #050505;
      color: white;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: url('cafe_juntos.jpg') center/cover no-repeat;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.3rem;
      opacity: 0.85;
      margin-bottom: 35px;
    }

    a.button {
      display: inline-block;
      padding: 14px 30px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 500;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    a.button:hover {
      transform: scale(1.05);
      background: #f2f2f2;
    }

    section {
      padding: 90px 20px;
    }

    iframe {
      width: 100%;
      max-width: 850px;
      height: 480px;
      border-radius: 15px;
    }

    .final {
      margin-top: 40px;
      opacity: 0.75;
      font-size: 1rem;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {

      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
      }

      iframe {
        height: 220px;
      }
    }

  </style>
</head>

<body>

<div class="hero">
  <div class="overlay"></div>

  <div class="content">
    <h1>No sabía cómo decirlo…</h1>
    <p>así que hice esto para ti.</p>

    <a href="#video" class="button">Esto es para ti</a>
  </div>
</div>

<section id="video">

  <iframe 
    src="https://www.youtube.com/embed/TU_VIDEO_ID"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <div class="final">
    Y sí… pensé en ti todo el tiempo.
  </div>

</section>

</body>
</html>
