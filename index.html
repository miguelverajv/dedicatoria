<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para ti</title>

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #050505;
      color: white;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: url('cafe_juntos.jpg') center/cover no-repeat;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
    }

    p {
      opacity: 0.8;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
    }

    section {
      padding: 80px 20px;
    }

    iframe {
      width: 100%;
      max-width: 800px;
      height: 450px;
      border-radius: 15px;
    }

    .final {
      margin-top: 40px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="hero">
  <div class="overlay"></div>

  <div class="content">
    <h1>No sabía cómo decirlo…</h1>
    <p>así que hice esto para ti.</p>

    <a href="#video" class="button">Esto es para ti</a>
  </div>
</div>

<section id="video">

  <iframe 
    src="https://www.youtube.com/embed/TU_VIDEO_ID"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <div class="final">
    Y sí… pensé en ti todo el tiempo.
  </div>

</section>

</body>
</html>
